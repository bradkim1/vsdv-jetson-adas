# Run on Jetson Nano (bk-jetson)
version: "3.8"
services:
  kuksa-databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:latest
    container_name: kuksa-databroker
    ports:
      - "55555:55555"
    command: ["--port", "55555", "--insecure"]
    networks:
      - vsdv-net
    restart: unless-stopped

  adas-inference:
    # Context is the repo root so the image can include agent/vss.py, which the
    # node imports. Building from ./adas cannot see it and fails at import.
    build:
      context: .
      dockerfile: adas/Dockerfile
    container_name: vsdv-adas
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ADAS_MODE=${ADAS_MODE:-synthetic}   # set to "carla" when CARLA is running
      - CARLA_HOST=${CARLA_HOST:-192.168.55.100}
      - CARLA_CAM_PORT=9999
    volumes:
      # Mount the engine cache on a SUBPATH. Mounting it at /app shadows the
      # image's own code, so a rebuilt image would keep running whatever source
      # the old volume still held.
      - trt-models:/app/models
    networks:
      - vsdv-net
    depends_on:
      - kuksa-databroker
    restart: unless-stopped

volumes:
  trt-models:

networks:
  vsdv-net:
    external: true
