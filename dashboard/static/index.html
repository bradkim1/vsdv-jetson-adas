<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vSDV Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --blue: #58a6ff; --text: #e6edf3; --muted: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; color: var(--blue); letter-spacing: 2px; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 6px; }
  #status-dot.live { background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 12px; padding: 12px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .panel-title { font-size: 0.7rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }

  /* Speed gauge */
  #gauge-wrap { position: relative; text-align: center; }
  #speed-val { font-size: 3rem; font-weight: bold; color: var(--blue); }
  #speed-unit { font-size: 0.8rem; color: var(--muted); }
  canvas#speedGauge { max-height: 120px; }

  /* AEB status */
  #aeb-box {
    border-radius: 8px; padding: 20px; text-align: center;
    font-size: 1.4rem; font-weight: bold; letter-spacing: 2px;
    transition: all 0.2s;
  }
  #aeb-box.clear    { background: #0d2b0d; color: var(--green); border: 2px solid var(--green); }
  #aeb-box.warning  { background: #2b1d0d; color: var(--yellow); border: 2px solid var(--yellow); }
  #aeb-box.caution  { background: #2b1500; color: #ff8c00; border: 2px solid #ff8c00; }
  #aeb-box.emergency{ background: #2b0d0d; color: var(--red); border: 2px solid var(--red);
                       animation: flash 0.4s infinite; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* Signals grid */
  .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sig { background: #0d1117; border-radius: 6px; padding: 10px; }
  .sig-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; }
  .sig-value { font-size: 1.3rem; font-weight: bold; color: var(--text); margin-top: 2px; }

  /* Brake bar */
  #brake-bar-wrap { margin-top: 8px; }
  #brake-bar-bg { background: #1c1c1c; border-radius: 4px; height: 16px; overflow: hidden; }
  #brake-bar { height: 100%; width: 0%; background: var(--green); border-radius: 4px; transition: width 0.2s, background 0.2s; }

  /* Camera */
  #camera-feed { width: 100%; border-radius: 6px; aspect-ratio: 4/3; object-fit: cover; background: #000; }

  /* Map */
  #map { height: 220px; border-radius: 6px; }

  /* Charts */
  canvas.chart { max-height: 120px; }

  /* Camera spans full width bottom */
  .cam-panel { grid-column: 1 / 3; }
  .map-panel { grid-column: 3 / 4; grid-row: 1 / 3; }
</style>
</head>
<body>

<header>
  <h1>⚡ vSDV REAL-TIME DASHBOARD</h1>
  <div>
    <span id="status-dot"></span>
    <span id="status-text" style="font-size:0.8rem; color:var(--muted)">Connecting...</span>
    <span style="margin-left:16px; font-size:0.75rem; color:var(--muted)">
      Jetson Nano + RTX 5090 + CARLA 0.9.15
    </span>
  </div>
</header>

<div class="grid">

  <!-- Speed Gauge -->
  <div class="panel">
    <div class="panel-title">Vehicle Speed</div>
    <div id="gauge-wrap">
      <canvas id="speedGauge" class="chart"></canvas>
      <div><span id="speed-val">0</span> <span id="speed-unit">km/h</span></div>
    </div>
  </div>

  <!-- AEB Status -->
  <div class="panel">
    <div class="panel-title">AEB / Collision Status</div>
    <div id="aeb-box" class="clear">CLEAR</div>
    <div style="margin-top:12px;">
      <div class="panel-title">Brake Pedal</div>
      <div id="brake-bar-wrap">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:0.75rem;color:var(--muted)">0%</span>
          <span id="brake-pct" style="font-size:0.9rem;font-weight:bold;">0%</span>
          <span style="font-size:0.75rem;color:var(--muted)">100%</span>
        </div>
        <div id="brake-bar-bg"><div id="brake-bar"></div></div>
      </div>
    </div>
  </div>

  <!-- Map (spans 2 rows) -->
  <div class="panel map-panel">
    <div class="panel-title">GPS Location</div>
    <div id="map"></div>
    <div style="margin-top:8px; font-size:0.75rem; color:var(--muted);">
      <span id="gps-lat">--</span> / <span id="gps-lon">--</span>
    </div>
  </div>

  <!-- Signals -->
  <div class="panel">
    <div class="panel-title">Vehicle Signals</div>
    <div class="sig-grid">
      <div class="sig">
        <div class="sig-label">STEERING</div>
        <div class="sig-value" id="sig-steer">0.0°</div>
      </div>
      <div class="sig">
        <div class="sig-label">OBSTACLE</div>
        <div class="sig-value" id="sig-obstacle" style="color:var(--green)">NONE</div>
      </div>
      <div class="sig">
        <div class="sig-label">TRT LATENCY</div>
        <div class="sig-value" id="sig-latency">0ms</div>
      </div>
      <div class="sig">
        <div class="sig-label">EBA ENGAGED</div>
        <div class="sig-value" id="sig-eba" style="color:var(--green)">OFF</div>
      </div>
    </div>
  </div>

  <!-- Speed Chart -->
  <div class="panel">
    <div class="panel-title">Speed History</div>
    <canvas id="speedChart" class="chart"></canvas>
  </div>

  <!-- Camera Feed -->
  <div class="panel cam-panel">
    <div class="panel-title">CARLA Camera Feed (TensorRT ADAS)</div>
    <img id="camera-feed" src="/camera" alt="CARLA Camera Feed">
  </div>

</div>

<script>
// ── WebSocket ──────────────────────────────────────────────────────────────
const dot  = document.getElementById('status-dot');
const stxt = document.getElementById('status-text');
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    dot.classList.add('live');
    stxt.textContent = 'LIVE';
    stxt.style.color = '#3fb950';
  };
  ws.onclose = () => {
    dot.classList.remove('live');
    stxt.textContent = 'Reconnecting...';
    stxt.style.color = '#f85149';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => update(JSON.parse(e.data));
}
connect();

// ── Speed Gauge (doughnut) ─────────────────────────────────────────────────
const gaugeCtx = document.getElementById('speedGauge').getContext('2d');
const gaugeChart = new Chart(gaugeCtx, {
  type: 'doughnut',
  data: {
    datasets: [{
      data: [0, 120],
      backgroundColor: ['#58a6ff', '#1c2128'],
      borderWidth: 0,
      circumference: 240,
      rotation: -120,
    }]
  },
  options: {
    responsive: true,
    cutout: '80%',
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    animation: { duration: 200 }
  }
});

// ── Speed History Chart ────────────────────────────────────────────────────
const MAX_POINTS = 60;
const speedData = Array(MAX_POINTS).fill(0);
const speedCtx  = document.getElementById('speedChart').getContext('2d');
const speedChart = new Chart(speedCtx, {
  type: 'line',
  data: {
    labels: Array(MAX_POINTS).fill(''),
    datasets: [{
      data: speedData,
      borderColor: '#58a6ff',
      backgroundColor: 'rgba(88,166,255,0.1)',
      borderWidth: 2,
      fill: true,
      tension: 0.3,
      pointRadius: 0,
    }]
  },
  options: {
    responsive: true,
    animation: false,
    scales: {
      x: { display: false },
      y: { min: 0, max: 120, grid: { color: '#21262d' },
           ticks: { color: '#8b949e', font: { size: 10 } } }
    },
    plugins: { legend: { display: false } }
  }
});

// ── Leaflet Map ────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, attributionControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
map.setView([37.7749, -122.4194], 16);

const marker = L.circleMarker([37.7749, -122.4194], {
  radius: 8, fillColor: '#58a6ff', color: '#fff',
  weight: 2, opacity: 1, fillOpacity: 0.9
}).addTo(map);

const trail = L.polyline([], { color: '#3fb950', weight: 2, opacity: 0.7 }).addTo(map);
const trailPoints = [];

// ── Update function ────────────────────────────────────────────────────────
function update(d) {
  // Speed
  const spd = Math.round(d.speed);
  document.getElementById('speed-val').textContent = spd;
  gaugeChart.data.datasets[0].data = [Math.min(spd, 120), Math.max(0, 120 - spd)];
  gaugeChart.update('none');

  // Speed history
  speedData.shift(); speedData.push(d.speed);
  speedChart.data.datasets[0].data = [...speedData];
  speedChart.update('none');

  // Brake bar
  const brakePct = d.brake;
  const brakeBar = document.getElementById('brake-bar');
  document.getElementById('brake-pct').textContent = brakePct + '%';
  brakeBar.style.width = brakePct + '%';
  if (brakePct >= 100)     brakeBar.style.background = '#f85149';
  else if (brakePct >= 70) brakeBar.style.background = '#ff8c00';
  else if (brakePct >= 30) brakeBar.style.background = '#d29922';
  else                     brakeBar.style.background = '#3fb950';

  // AEB box
  const aebBox = document.getElementById('aeb-box');
  if (brakePct >= 100 || d.aeb) {
    aebBox.className = 'emergency'; aebBox.textContent = '⚡ EMERGENCY BRAKE';
  } else if (brakePct >= 70) {
    aebBox.className = 'caution'; aebBox.textContent = '⚠ CAUTION';
  } else if (brakePct >= 30 || d.warning) {
    aebBox.className = 'warning'; aebBox.textContent = '! WARNING';
  } else {
    aebBox.className = 'clear'; aebBox.textContent = '✓ CLEAR';
  }

  // Signals
  document.getElementById('sig-steer').textContent = d.steer.toFixed(1) + '°';
  document.getElementById('sig-latency').textContent = d.latency_ms.toFixed(1) + 'ms';

  const obsEl = document.getElementById('sig-obstacle');
  obsEl.textContent = d.obstacle ? 'DETECTED' : 'NONE';
  obsEl.style.color = d.obstacle ? '#f85149' : '#3fb950';

  const ebaEl = document.getElementById('sig-eba');
  ebaEl.textContent = d.aeb ? 'ON ⚡' : 'OFF';
  ebaEl.style.color = d.aeb ? '#f85149' : '#3fb950';

  // GPS
  if (d.lat && d.lon && d.lat !== 0 && d.lon !== 0) {
    document.getElementById('gps-lat').textContent = d.lat.toFixed(5);
    document.getElementById('gps-lon').textContent = d.lon.toFixed(5);
    marker.setLatLng([d.lat, d.lon]);
    trailPoints.push([d.lat, d.lon]);
    if (trailPoints.length > 200) trailPoints.shift();
    trail.setLatLngs(trailPoints);
    if (trailPoints.length % 20 === 0) map.panTo([d.lat, d.lon]);
  }
}
</script>
</body>
</html>
